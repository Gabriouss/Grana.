<script>
(function () {
  window.__timelines = window.__timelines || {};
  const C = __DADOS__;
  const P = C.palavras, T = i => P[i].a, E = i => P[i].b, DUR = C.dur;
  const tl = gsap.timeline({ paused: true });
  document.querySelectorAll('.flap .c').forEach(el => el.style.transform = 'none');
  const W = '#EFFFFE', M = '#ADFBE3';
  gsap.set('#cel', { transformPerspective: 2400 });
  // o aparelho nunca fica parado: flutua de leve o vídeo inteiro
  tl.fromTo('#flut', { y: 0, rotation: 0 }, { y: -12, rotation: .5, duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: Math.ceil(DUR / 1.7) }, 0);
  tl.fromTo('#bg', { scale: 1 }, { scale: 1.06, duration: DUR, ease: 'none' }, 0);
  function halo(t) {
    tl.fromTo('#halo', { opacity: 0 }, { opacity: .6, duration: .22, ease: 'power2.out', immediateRender: false }, t);
    tl.to('#halo', { opacity: 0, duration: .7, ease: 'power2.inOut' }, t + .22);
  }

  // tipografia grande: cada palavra sobe de dentro da própria linha (máscara) no instante em que é dita
  function revela(sel, idx) {
    tl.set(sel, { opacity: 1 }, Math.max(0, T(idx[0]) - .07));
    document.querySelectorAll(sel + ' .w').forEach(function (w, k) {
      const t0 = T(idx[k]) - .06;
      // a primeira palavra do vídeo já nasce subindo, para o quadro 0 não sair vazio
      if (t0 < 0.02) tl.fromTo(w, { y: '12%' }, { y: '0%', duration: .25, ease: 'power3.out' }, 0);

  function sai(sel, t) { tl.to(sel, { opacity: 0, y: -46, filter: 'blur(10px)', duration: .24, ease: 'power2.in' }, t); }

  // E06, placa de aeroporto: cada dígito sorteia a 15 trocas/s e trava da esquerda para a direita (50 ms entre células)
  function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0); }
  function flap(sel, t0) {
    const cs = Array.prototype.slice.call(document.querySelectorAll(sel + ' .c'));
    const fin = cs.map(function (c) { return c.textContent; });
    const nums = cs.map(function (c) { return c.classList.contains('n'); });
    let ordem = 0; const trava = cs.map(function (c, i) { return nums[i] ? t0 + .55 + (ordem++) * .05 : t0; });
    const o = { t: 0 }, fim = trava[trava.length - 1] + .1 - t0;
    function pinta() {
      const t = t0 + o.t;
      cs.forEach(function (c, i) {
        if (!nums[i]) return;
        if (t >= trava[i]) { c.textContent = fin[i]; c.style.transform = 'none'; return; }
        const passo = Math.floor((t - t0) / .066), fr = ((t - t0) / .066) % 1;
        c.textContent = String(hash(i + 1, passo) % 10);
        // lâmina dobrando na primeira metade de cada troca
        c.style.transform = fr < .5 ? 'scaleY(' + (.55 + .9 * fr).toFixed(3) + ')' : 'none';
      });
    }
    tl.fromTo(o, { t: 0 }, { t: fim, duration: fim, ease: 'none', onUpdate: pinta, immediateRender: false }, t0);
  }
  // número que muda de valor rolando (contador comum, sem sorteio)
  function rola(el, de, para, t, d) {
    const o = { v: de };
    const fmt = function (v) { return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
    tl.fromTo(o, { v: de }, { v: para, duration: d, ease: 'power2.out', immediateRender: false,
      onUpdate: function () { document.querySelector(el).textContent = fmt(o.v); } }, t);
  }

  // ---- ícones do arsenal derivando devagar na abertura e no CTA
  C.icones.forEach(function (c) {
    tl.fromTo('#' + c.id, { opacity: 0, y: c.dy[0], rotation: c.rot[0] }, { opacity: c.op, y: c.dy[1], rotation: c.rot[1], duration: c.b - c.a, ease: 'none' }, c.a);
    tl.fromTo('#' + c.id, { y: c.dy[1] }, { opacity: 0, y: c.dy[1] - 60, duration: .3, ease: 'power2.in', immediateRender: false }, c.b);

  // ---- gancho
  const G0 = C.gancho;
  tl.fromTo('#h1', { scale: 1 }, { scale: 1.035, duration: G0.sai, ease: 'none', transformOrigin: '0% 50%' }, 0);
  revela('#h1', G0.idx);
  if (G0.ul != null) tl.to('#h1 .ul', { scaleX: 1, duration: .38, ease: 'expo.out' }, T(G0.ul) + .05);
  if (G0.pulso != null) tl.fromTo('#h1 .w[data-k="' + G0.pulso + '"]', { scale: 1 }, { scale: 1.07, duration: .14, yoyo: true, repeat: 1, ease: 'power2.out' }, T(G0.pulso) + .12);
  sai('#h1', G0.sai);

  // ---- pílula com o contador (E04 na entrada, E06 no valor)
  if (C.pilula) {
    const p = C.pilula;
    tl.fromTo('#pill', { opacity: 0, scale: .94, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: .32, ease: 'back.out(1.7)' }, p.a);
    tl.fromTo('#pill .flap', {clipPath:'inset(0 100% 0 0)'}, {clipPath:'inset(0 0% 0 0)', duration:.38, ease:'power2.out'}, p.a + .05);
    tl.to('#pill', { opacity: 0, y: 30, filter: 'blur(8px)', duration: .26, ease: 'power2.in' }, p.b);
  }

  // ---- celular: sobe com inércia, deriva de leve, desce pelo mesmo caminho
  function sobe(t) {
    tl.fromTo('#cel', { y: 1700, rotationX: 22, rotationY: -8, scale: 1 }, { y: 0, rotationX: 0, rotationY: 0, duration: .72, ease: 'back.out(1.05)', immediateRender: false }, t);
    halo(t + .5);

  function brilho(t) { tl.fromTo('#sweep', { x: -150 }, { x: 1222, duration: 1.0, ease: 'power2.inOut', immediateRender: false }, t); }

    tl.set(id, { opacity: 0 }, b);

    tl.to('#cel', { scale: .955, duration: .16, ease: 'power2.in' }, t - .16);

    tl.set('#' + de, { opacity: 0 }, t);
    tl.set('#' + para, { opacity: 1 }, t);

    tl.to('#cel', { scale: 1, duration: .38, ease: 'back.out(2)' }, t);

  K.brilhos.forEach(brilho);

  // ---- dor em motion (própria de cada vídeo)
  (function (tl, T, E, C, flap, rola, revela, sai) {
    __DOR_JS__
  })(tl, T, E, C, flap, rola, revela, sai);

  tl.fromTo('#setap', { attr: { 'stroke-dashoffset': 100 } }, { attr: { 'stroke-dashoffset': 0 }, duration: .14, ease: 'power2.out' }, T(A.seta));

  // o logo segue respirando até o fim, para o fecho não ficar parado (trava 4)
  tl.to('#logo', { scale: 1.06, y: -10, duration: __DUR__ - C.logo - .7, ease: 'sine.inOut' }, C.logo + .7);

  // ---- legenda karaokê: grupo entra com a primeira palavra, palavra dita fica menta, sai antes do próximo
  const GR = C.grupos;
  GR.forEach(function (g, n) {

    const prox = n + 1 < GR.length ? T(GR[n + 1][0]) - .05 : 99;
    const fim = Math.min(prox, P[g[g.length - 1]].b + .45, C.cortes.find(function (c) { return c > a; }) || 99);
    // a entrada nunca passa da saída: grupo curto entra e sai mais rápido, sem ficar aceso por cima do próximo
    const ent = Math.min(.18, (fim - a) / 2), sd = Math.min(.12, (fim - a) / 2);

    g.forEach(function (i, k) {
