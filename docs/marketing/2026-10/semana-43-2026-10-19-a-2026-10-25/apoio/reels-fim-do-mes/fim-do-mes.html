  }
  function soco(id, t) { tl.fromTo(id + " .d", { scale: 1 }, { scale: 1.12, duration: .12, yoyo: true, repeat: 1, ease: "power1.out" }, t); }

  function troca(de, para, t) {

    tl.fromTo("#fm-flash", { opacity: 0 }, { opacity: .55, duration: .09, yoyo: true, repeat: 1 }, t - .1);

    tl.set(para, { opacity: 1 }, t);

  }

  // a dor: o dinheiro some no "sumiu" e a carteira treme vazia

  tl.fromTo("#fm-i3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .5, ease: "back.out(1.6)" }, .35);
  tl.to("#fm-i2", { y: -520, x: 120, rotation: 28, scale: .3, opacity: 0, duration: .7, ease: "power2.in" }, 2.55);
  tl.to("#fm-i3", { rotation: 5, duration: .07, yoyo: true, repeat: 5, ease: "none", transformOrigin: "50% 90%" }, 2.65);
  palavras("#fm-t1", [0.30, 0.72, 0.84, 0.96, 1.10, 2.17, 2.20, 2.30, 2.60], 3.17, undefined, 0.3);
  soco("#fm-t1", 2.70);
  palavras("#fm-t2", [3.52, 4.18, 4.40, 5.12, 5.30, 5.66, 6.41, 6.52, 6.94, 7.08, 8.10, 8.14, 8.52, 9.02], 9.43, undefined, 0.3);

  tl.to("#fm-i1", { opacity: 0, duration: .35 }, 9.12);

  // a solução: o celular sobe e assenta
