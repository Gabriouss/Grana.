name: CI

# GRN-BE-012 da auditoria de backend: não havia workflow nenhum, e um push
# direto podia publicar regressão de tipo ou de parser sem ninguém perceber
# antes de chegar em produção — foi exatamente essa falta de rede que deixou
# passar, em sessões anteriores, código que quebrava só quando executado de
# verdade.
#
# O workflow reúne os testes determinísticos do app, voz, widget, assistente e
# schema, além da checagem de tipos e das Edge Functions alteradas. A aplicação
# real do schema em um banco novo continua sendo uma etapa operacional do
# Supabase, porque este repositório não sobe Docker/Supabase local no CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verificação de tipos
        run: npx tsc --noEmit

      - name: Suítes determinísticas do app, voz, widget, assistente e schema
        run: npm run test:ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificação das Edge Functions alteradas
        run: |
          deno check supabase/functions/_shared/ai-quota.ts
          deno check supabase/functions/assistente-financeiro/index.ts
          deno check supabase/functions/processar-lancamento-voz/index.ts
