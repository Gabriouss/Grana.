apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.gabriouss.grana.voicewidget'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.gabriouss.grana.voicewidget"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    compileSdkVersion safeExtGet("compileSdkVersion", 35)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
  testOptions {
    unitTests.includeAndroidResources = true
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  /* HeadlessJsTaskService: é a ponte que entrega o arquivo gravado ao
     JavaScript do app sem abrir tela nenhuma. Vem do próprio React Native, que
     o app já tem — `compileOnly` não serve porque o serviço estende a classe
     em runtime. */
  implementation "com.facebook.react:react-android"
  implementation "androidx.work:work-runtime:2.10.1"
  testImplementation "junit:junit:4.13.2"
  testImplementation "androidx.work:work-testing:2.10.1"
  testImplementation "org.robolectric:robolectric:4.14.1"
}
