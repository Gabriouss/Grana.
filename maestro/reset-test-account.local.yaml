appId: com.gabriouss.grana
---
- launchApp:
    clearState: true
- tapOn:
    text: "E-mail"
- inputText: ${E2E_TEST_EMAIL}
- tapOn:
    text: "Senha"
- inputText: ${E2E_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Entrar"
- tapOn:
    text: "Pular por agora"
- tapOn:
    text: "Pular"
- extendedWaitUntil:
    visible: "Abrir perfil"
    timeout: 20000
- tapOn:
    text: "Abrir perfil"
- scroll
- scroll
- scroll
- extendedWaitUntil:
    visible: "Excluir conta e dados"
    timeout: 15000
- tapOn:
    text: "Excluir conta e dados"
- extendedWaitUntil:
    visible: "Sua senha"
    timeout: 10000
- tapOn:
    text: "Sua senha"
- inputText: ${E2E_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Excluir definitivamente"
- extendedWaitUntil:
    visible: "De volta"
    timeout: 30000
