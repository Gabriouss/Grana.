<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon da web — o símbolo "G." em gradiente, SEM fundo, idêntico em
  geometria e cor a design-system/marca/simbolo-gradiente.svg.

  As regras da marca que este arquivo precisa respeitar:

   1. O gradiente atravessa o símbolo como um objeto único, a 45° descendente.
      `gradientUnits="userSpaceOnUse"` com as coordenadas do vetor original —
      nunca `objectBoundingBox`, que reinicia a rampa no bounding box de cada
      elemento e quebra a continuidade entre o G e o ponto.
   2. O ponto faz parte do símbolo e é sempre o CONTRASTE dele: menta sólida
      (#a9f8c8), fora da rampa. Pintar o ponto com a mesma cor do G o dissolve
      dentro da letra.
   3. Fundo transparente. A variante com disco existe para o ícone do app
      instalado (design-system/marca/icone-circular.svg), onde o sistema
      operacional recorta a arte num container próprio. Na aba do navegador o
      disco vira uma bolha sólida que engole o símbolo no tamanho de 16px.

  Uma versão anterior deste arquivo desenhava o símbolo chapado numa cor só,
  trocando entre petróleo e menta por `prefers-color-scheme`. Ela perdia o
  gradiente e fundia o ponto no G, e como o `<link>` que a declara traz
  `type="image/svg+xml"` (que o Chrome prefere ao .ico), era ELA que aparecia
  na aba — divergindo do ícone correto do resto do sistema.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 459.56 459.56">
  <defs>
    <linearGradient id="granaGradiente" x1="67.51" y1="67.51" x2="392.26" y2="392.26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b0f7c9"/>
      <stop offset="1" stop-color="#22a1c1"/>
    </linearGradient>
  </defs>
  <path fill="url(#granaGradiente)" d="M459.56,229.78c0,19.55-2.44,38.53-7.04,56.66-25.23,99.5-115.39,173.12-222.74,173.12-48.1,0-92.76-14.78-129.66-40.05C40.79,378.88,1.47,311.14.04,234.14-2.38,104.34,104.35-2.38,234.14.04c72.25,1.35,136.33,36.04,177.53,89.32,4.63,5.99,4.09,14.5-1.26,19.85l-41.41,41.41c-6.66,6.66-17.64,5.58-23.04-2.13-25.2-35.94-66.64-59.66-113.67-60.47-79.81-1.39-145.65,64.45-144.27,144.27.93,53.56,31.56,99.88,76.12,123.2,19.63,10.26,41.96,16.07,65.64,16.07,48.5,0,91.31-24.35,116.87-61.49,6.89-10-.22-23.63-12.36-23.63h-64.78c-13.4,0-20.12-16.21-10.64-25.68l56.72-56.72c2.82-2.82,6.65-4.41,10.64-4.41h117.75c7.88,0,14.46,6.07,15.01,13.93.38,5.36.57,10.76.57,16.22Z"/>
  <circle fill="#a9f8c8" cx="426.09" cy="426.09" r="33.47"/>
</svg>
